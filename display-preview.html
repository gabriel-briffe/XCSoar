<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu de l'icône display</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #f4f5f7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  figure {
    margin: 0; padding: 40px 56px; background: #fff; border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center;
  }
  svg { display: block; margin: 0 auto; }
  figcaption { margin-top: 20px; font-size: 20px; color: #222; letter-spacing: .02em; }
</style>
</head>
<body>
<!-- Icône issue de Data/icons/display.svg (tuile "Display" du tiled menu) -->
<figure>
<svg version="1.1" viewBox="0 0 24 24" width="192" height="192" role="img" aria-label="display" xmlns="http://www.w3.org/2000/svg">
  <!--
    Hardware Display tile: phone frame, top of the screen split into
    four equal parts by one horizontal line and three vertical dividers,
    ownship glider centred in the remaining screen area.
  -->

  <!-- Phone outer frame -->
  <rect x="5" y="1.2" width="14" height="21.6" rx="2.2" ry="2.2"
        fill="none" stroke="#000" stroke-width="1.6"/>

  <!-- Top row: one horizontal line cut by three vertical dividers -->
  <g fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="butt">
    <path d="M5 4.9H19"/>
    <path d="M8.5 1.2V4.9"/>
    <path d="M12 1.2V4.9"/>
    <path d="M15.5 1.2V4.9"/>
  </g>

  <!-- Ownship glider (aircraft.svg), centred below the top row -->
  <g fill="#000"
     transform="translate(12 13.1) scale(0.36) translate(-14 -14)">
    <g transform="matrix(.81 0 0 .81 189.71 -241.68)">
      <path
            d="m-216.93 305.1a2.2547 2.2547 0 0 0-2.2553 2.2553v3.7149h-11.915a2.2547 2.2547 0 0 0-2.2553 2.2522 2.2547 2.2547 0 0 0 2.2553 2.2553h11.915v6.1212h-1.0538a2.2547 2.2547 0 0 0-2.2554 2.2553 2.2547 2.2547 0 0 0 2.2554 2.2522h6.6182a2.2547 2.2547 0 0 0 2.2553-2.2522 2.2547 2.2547 0 0 0-2.2553-2.2553h-1.0537v-6.1212h11.918a2.2547 2.2547 0 0 0 2.2522-2.2553 2.2547 2.2547 0 0 0-2.2522-2.2522h-11.918v-3.7149a2.2547 2.2547 0 0 0-2.2554-2.2553z"/>
    </g>
  </g>
</svg>
<figcaption>display</figcaption>
</figure>
</body>
</html>
