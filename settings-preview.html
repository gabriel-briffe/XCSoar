<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu de l'icône Settings</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #f4f5f7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  figure {
    margin: 0; padding: 40px 56px; background: #fff; border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center;
  }
  svg { display: block; margin: 0 auto; }
  figcaption { margin-top: 20px; font-size: 20px; color: #222; letter-spacing: .02em; }
</style>
</head>
<body>
<!-- Icône issue de Data/icons/settings_wrench.svg (tuile "Settings" de l'écran Glide Computer, IDB_SETTINGS_WRENCH) -->
<figure>
<svg width="192" height="192" role="img" aria-label="Settings" version="1.1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!--
    Settings tile: open-end wrench alone, extracted from wrench.svg
    (Tools icon, public domain Openclipart). The screwdriver was removed
    and the two wrench halves it covered were joined into one shaft.
    Centred in the 24×24 viewBox.
  -->
  <g transform="translate(12 12) scale(0.145) translate(-82 -76)">
    <path fill="#000"
          d="M20 0 L18 4 L39 16 C39 26 35 34 26 39 L5 27 L4 29 C9 44 19 54 39 54 C44 54 59 69 67 77 L79 89 C91 101 107 117 107 122 C107 140 112 152 144 152 L146 148 L125 136 C125 126 129 118 138 113 L159 125 L160 123 C155 108 145 98 125 98 C120 98 107 85 95 73 L83 61 C75 53 57 35 57 30 C57 12 52 0 20 0 Z"/>
  </g>
</svg>
<figcaption>Settings</figcaption>
</figure>
</body>
</html>
