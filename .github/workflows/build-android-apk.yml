name: Android aarch64 APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Mark git directory as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          sudo ./ide/provisioning/install-debian-packages.sh UPDATE
          sudo ./ide/provisioning/install-debian-packages.sh BASE
          sudo ./ide/provisioning/install-debian-packages.sh LINUX
          sudo ./ide/provisioning/install-debian-packages.sh ARM
          sudo ./ide/provisioning/install-debian-packages.sh LLVM
          sudo ./ide/provisioning/install-debian-packages.sh ANDROID
          sudo apt-get install -y openjdk-21-jdk-headless
          ./ide/provisioning/install-android-tools.sh NDK
          ./ide/provisioning/install-android-tools.sh SDK
          sudo ./ide/provisioning/install-debian-packages.sh CLEAN

      - name: Build arm64 APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          make -j$(nproc) TARGET=ANDROIDAARCH64 DEBUG=y USE_CCACHE=y V=2 \
            ANDROID_SDK="$HOME/opt/android-sdk-linux" \
            ANDROID_NDK="$HOME/opt/android-ndk-r26d" \
            output/ANDROID/bin/XCSoar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XCSoar-aarch64
          path: output/ANDROID/bin/XCSoar*.apk
          if-no-files-found: error
