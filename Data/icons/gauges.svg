<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!--
    Gauges folder draft (not wired yet).
    Top: FLARM-style radar (2 rings + overflowing cross).
    Bottom-left: vario arc + needle (SVG Repo style).
    Bottom-right: final-glide / relative-alt chevrons.
  -->

  <!-- Top radar: centered upper half
       stroke ~0.85 matches vario's visual weight after scale(0.55) -->
  <g fill="none" stroke="#000" stroke-width="0.85" stroke-linecap="round"
     stroke-linejoin="round">
    <circle cx="12" cy="7" r="5.2"/>
    <circle cx="12" cy="7" r="2.6"/>
    <!-- overflowing cross axes -->
    <path d="M12 0.6 V13.4"/>
    <path d="M5.2 7 H18.8"/>
  </g>

  <!-- Bottom-left vario arc (from SVG Repo sketch, scaled into corner) -->
  <g fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"
     stroke-linejoin="round"
     transform="translate(0.2 10.2) scale(0.55)">
    <path d="M12 15l3.5-3.5"/>
    <path d="M20.3 18c.4-1 .7-2.2.7-3.4C21 9.8 17 6 12 6s-9 3.8-9 8.6c0 1.2.3 2.4.7 3.4"/>
  </g>

  <!-- Bottom-right: up, up, bar, down, down -->
  <g fill="#000" stroke="none">
    <path d="M17.2 13.0 L19.5 11.0 L21.8 13.0 Z"/>
    <path d="M17.2 15.2 L19.5 13.2 L21.8 15.2 Z"/>
    <rect x="17.2" y="16.0" width="4.6" height="1.2" rx="0.3"/>
    <path d="M17.2 18.0 L19.5 20.0 L21.8 18.0 Z"/>
    <path d="M17.2 20.2 L19.5 22.2 L21.8 20.2 Z"/>
  </g>
</svg>
