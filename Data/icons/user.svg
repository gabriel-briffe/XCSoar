<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!--
    Abstract user icon by Treer (gitlab.com/Treer).
    Monochrome silhouette for Config menu Profiles tile.
    Normalised to 24×24 viewBox (was 600×600).
  -->
  <g transform="scale(0.04)">
    <defs>
      <clipPath id="circular-border">
        <circle cx="300" cy="300" r="250"/>
      </clipPath>
    </defs>
    <circle cx="300" cy="300" r="270" fill="none" stroke="#000" stroke-width="36"/>
    <circle cx="300" cy="230" r="100" fill="#000"/>
    <circle cx="300" cy="550" r="190" fill="#000"
            clip-path="url(#circular-border)"/>
  </g>
</svg>
