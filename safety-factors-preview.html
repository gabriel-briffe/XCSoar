<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu de l'icône Safety Factors</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #f4f5f7; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  figure {
    margin: 0; padding: 40px 56px; background: #fff; border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center;
  }
  svg { display: block; margin: 0 auto; }
  figcaption { margin-top: 20px; font-size: 20px; color: #222; letter-spacing: .02em; }
</style>
</head>
<body>
<!-- Icône issue de Data/icons/safety_factors.svg (tuile "Safety Factors" du tiled menu, IDB_SAFETY_FACTORS) -->
<figure>
<svg width="192" height="192" role="img" aria-label="Safety Factors" version="1.1" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!--
    Safety Factors tile: simplified terrain (two peaks on a ground line),
    safety altitude line above, and a double-headed vertical arrow from
    the highest peak up to that line marking the terrain clearance margin.
  -->

  <!-- Safety altitude line -->
  <path fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"
        d="M2 3.2 H22"/>

  <!-- Terrain: ground line with two peaks -->
  <path fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"
        stroke-linejoin="round"
        d="M2 21.5 L9 14.2 L12.5 17.8 L15.5 15.4 L22 21.5 Z"/>

  <!-- Margin: double-headed vertical arrow between peak and altitude line -->
  <g fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M9 5.4 V12"/>
    <path d="M7.5 6.7 L9 5.2 L10.5 6.7"/>
    <path d="M7.5 10.7 L9 12.2 L10.5 10.7"/>
  </g>
</svg>
<figcaption>Safety Factors</figcaption>
</figure>
</body>
</html>
